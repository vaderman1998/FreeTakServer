[tool.poetry]
name = "FreeTAKServer"
version = "2.4.0"
description = "An open source server for the TAK family of applications."
authors = ["FreeTAKTeam <FreeTakTeam@gmail.com>"]
readme = "README.md"
packages = [
    {include = "FreeTAKServer"}
    ]
include = ["FreeTAKServer/**/*.json", "FreeTAKServer/**/*.py", "FreeTAKServer/**/*.ini", "FreeTAKServer/**/*.conf"]

[tool.poetry.dependencies]
python = "^3.11"
bitarray="*"
click=">=8.1.3"
# ranges (not exact pins) on the deps below keep FreeTAKServer co-installable
# with FreeTAKServer-UI, which pins its own versions of the same packages
colorama=">=0.4.4"
# certificate generation uses the modern cryptography x509/pkcs12 APIs
cryptography=">=42"
defusedxml="0.7.1"
dnspython=">=2.2.1"
eventlet=">=0.35.2"
Flask="3.0.2"
Flask-Cors="4.0.0"
Flask-HTTPAuth="4.8.0"
Flask-Login="0.6.3"
Flask-SocketIO="5.3.6"
Flask-SQLAlchemy="3.1.1"
geographiclib="1.52"
geopy="2.2.0"
greenlet="3.0.3"
itsdangerous=">=2.0.1"
testresources="2.0.1"
Jinja2="3.1.3"
lxml="*"
MarkupSafe="2.1.5"
monotonic="1.6"
# pb2 files are generated with protoc v29.x; runtimes support gencode from
# their own major and one major prior, hence the <7 ceiling
protobuf=">=5.29.5,<7"
psutil="5.9.4"
pykml="0.2.0"
python-engineio="4.9.0"
python-socketio="5.11.1"
PyYAML="6.0.1"
"ruamel.yaml"="0.17.21"
"ruamel.yaml.clib"="0.2.8"
six="1.16.0"
SQLAlchemy="2.0.29"
tabulate="0.8.7"
Werkzeug="3.0.1"
WTForms="2.3.3"
qrcode="7.3.1"
pillow=">=10"
xmltodict="*"
pyzmq="*"
digitalpy="0.3.13.7"
# <1.34.1: BatchSpanProcessor.span_exporter became a read-only property in 1.35
# (backported to 1.34.1), which breaks digitalpy's TracerProcessor configuration
# (crashes the CoT services at startup)
opentelemetry-sdk=">=1.20,<1.34.1"
requests=">=2.28"
PyJWT="*"
FreeTAKServer_UI = {version = "2.2.1", optional = true}
pytak = {version = "5.4.1", optional = true}
pytest = {version = "7.2.0", optional = true}
pytest-asyncio = {version = "0.20.1", optional = true}
[tool.poetry.extras]
ui = ["FreeTAKServer_UI"]
dev = ["pytak", "pytest", "pytest-asyncio"]
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
